global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'article-system'
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx:80']
        labels:
          app: 'article-submission-system'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
